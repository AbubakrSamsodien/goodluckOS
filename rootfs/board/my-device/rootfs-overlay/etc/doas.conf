permit nopass player as root cmd /sbin/poweroff
permit nopass player as root cmd /sbin/reboot
permit nopass player as root cmd evsieve
permit nopass player as root cmd /usr/bin/evsieve
permit nopass player as root cmd appctl
permit nopass player as root cmd /usr/local/bin/appctl
permit nopass player as root cmd umount
# PortMaster: port scripts run as player and use $ESUDO for mounts
# (squashfs runtimes via loop), chmod on /dev/uinput, zramctl, etc.
# Single-user game console, root console already open over USB serial,
# so blanket permit is consistent with the device's posture.
permit nopass player as root
